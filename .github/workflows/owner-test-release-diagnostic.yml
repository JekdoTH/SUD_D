name: Owner-test release Git diagnostic
on:
  push:
    branches: [codex/owner-test-release-ci-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sud-d/infrastructure... run build
      - run: node scripts/release/diagnose-git-ci.mjs
