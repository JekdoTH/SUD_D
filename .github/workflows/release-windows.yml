name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify and build Windows release
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify tag, version, and master ancestry
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tag must be strict vX.Y.Z SemVer.'
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = (Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw 'Release tag does not match packages/desktop/package.json.'
          }
          git fetch origin master --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'Tagged release commit is not contained in origin/master.'
          }

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run focused release verification
        shell: pwsh
        run: >
          pnpm exec cross-env ELECTRON_RUN_AS_NODE=1 electron ./node_modules/vitest/vitest.mjs run
          packages/tests/src/public-readiness.test.ts
          packages/tests/src/release-workflow.test.ts
          packages/tests/src/update-release-tooling.test.ts
          packages/tests/src/update-manifest-security.test.ts
          packages/tests/src/update-controller.test.ts
          packages/tests/src/update-desktop-ipc.test.ts
          packages/tests/src/update-packaging.test.ts
          --reporter=verbose

      - name: Package Windows candidate
        shell: pwsh
        env:
          SUD_D_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/packages/desktop/release/update-public-key.pem
        run: pnpm package:win

      - name: Verify packaged release
        shell: pwsh
        run: node scripts/release/verify-windows-release.mjs --tag $env:GITHUB_REF_NAME --revision $env:GITHUB_SHA

      - name: Upload verified Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist-release/SUD-D-Setup-*.exe
            dist-release/SUD-D-Setup-*.exe.blockmap
            dist-release/latest.yml

  release:
    name: Sign and publish GitHub Release
    needs: verify-build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Download verified Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: dist-release

      - name: Materialize release signing key
        id: signing-key
        shell: pwsh
        env:
          SUD_D_RELEASE_PRIVATE_KEY_B64: ${{ secrets.SUD_D_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUD_D_RELEASE_PRIVATE_KEY_B64)) {
            throw 'Release signing secret is not configured.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'sud-d-release-private-key.pem'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SUD_D_RELEASE_PRIVATE_KEY_B64))
          "key_path=$keyPath" >> $env:GITHUB_OUTPUT

      - name: Verify signing identity
        shell: pwsh
        env:
          SUD_D_RELEASE_PRIVATE_KEY_FILE: ${{ steps.signing-key.outputs.key_path }}
          SUD_D_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/packages/desktop/release/update-public-key.pem
        run: node scripts/release/verify-signing-key.mjs

      - name: Generate and verify signed release metadata
        shell: pwsh
        env:
          SUD_D_RELEASE_PRIVATE_KEY_FILE: ${{ steps.signing-key.outputs.key_path }}
          SUD_D_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/packages/desktop/release/update-public-key.pem
        run: |
          node scripts/release/render-release-notes.mjs docs/release/release-notes.json
          node scripts/release/create-manifest.mjs docs/release/release-notes.json
          node scripts/release/verify-release.mjs

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "dist-release/SUD-D-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "SUD-D $env:GITHUB_REF_NAME" --notes-file dist-release/RELEASE_NOTES.md $installer $blockmap dist-release/latest.yml dist-release/sud-d-release.json dist-release/RELEASE_NOTES.md

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = '${{ steps.signing-key.outputs.key_path }}'
          if (-not [string]::IsNullOrWhiteSpace($keyPath) -and (Test-Path -LiteralPath $keyPath)) {
            Remove-Item -LiteralPath $keyPath -Force
          }
